pluginManagement {
    repositories {
        maven {
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            content { includeGroupByRegex 'com\\.gtnewhorizons.*' }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'STFR'
